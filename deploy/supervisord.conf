[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisord

[unix_http_server]
file=/var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/nginx/access.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/nginx/error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
priority=100

[program:stasis-api]
command=/usr/local/bin/stasis-server
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/stasis/api.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/var/log/stasis/api-error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
environment=
    CONFIG_PATH="/app/configs/config.yaml",
    STASIS_DATABASE_HOST="%(ENV_STASIS_DATABASE_HOST)s",
    STASIS_DATABASE_PORT="%(ENV_STASIS_DATABASE_PORT)s",
    STASIS_DATABASE_USER="%(ENV_STASIS_DATABASE_USER)s",
    STASIS_DB_PASSWORD="%(ENV_STASIS_DB_PASSWORD)s",
    STASIS_DATABASE_DBNAME="%(ENV_STASIS_DATABASE_DBNAME)s",
    STASIS_DATABASE_SSLMODE="%(ENV_STASIS_DATABASE_SSLMODE)s",
    STASIS_SERVER_HOST="0.0.0.0",
    STASIS_SERVER_PORT="8080",
    STASIS_SERVER_MODE="release",
    STASIS_SSH_HOST="0.0.0.0",
    STASIS_SSH_PORT="2222",
    STASIS_STORAGE_TYPE="%(ENV_STASIS_STORAGE_TYPE)s",
    STASIS_STORAGE_BASE_PATH="%(ENV_STASIS_STORAGE_BASE_PATH)s",
    STASIS_OIDC_ENABLED="%(ENV_STASIS_OIDC_ENABLED)s",
    STASIS_OIDC_ISSUER_URL="%(ENV_STASIS_OIDC_ISSUER_URL)s",
    STASIS_OIDC_CLIENT_ID="%(ENV_STASIS_OIDC_CLIENT_ID)s",
    STASIS_OIDC_CLIENT_SECRET="%(ENV_STASIS_OIDC_CLIENT_SECRET)s",
    STASIS_OIDC_REDIRECT_URL="%(ENV_STASIS_OIDC_REDIRECT_URL)s",
    STASIS_OIDC_JWT_SECRET="%(ENV_STASIS_OIDC_JWT_SECRET)s",
    STASIS_OIDC_FRONTEND_URL="%(ENV_STASIS_OIDC_FRONTEND_URL)s",
    STASIS_CI_API_KEY="%(ENV_STASIS_CI_API_KEY)s"
priority=200
startsecs=5
startretries=3

[program:logrotate]
command=/usr/sbin/logrotate /etc/logrotate.d/stasis
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisord/logrotate.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
stderr_logfile=/var/log/supervisord/logrotate-error.log
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=1
priority=50
startsecs=0

[program:stasis-web]
command=bun run start
directory=/app/web
autostart=true
autorestart=true
stdout_logfile=/var/log/stasis/web.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/var/log/stasis/web-error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
environment=
    NEXT_PUBLIC_API_URL="http://localhost/api",
    STASIS_SERVER_HOSTED_URL="http://localhost",
    STASIS_SSH_HOST_NAME="localhost:2222",
    DOCKER_ENV="true"
priority=300
startsecs=5
startretries=3
