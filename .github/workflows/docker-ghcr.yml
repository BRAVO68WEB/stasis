name: docker-ghcr

on:
  push:
    branches:
      - main

jobs:
  # ============================================================
  # API Image - amd64
  # ============================================================
  build-api-amd64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.api
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/stasis-api:latest-amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # API Image - arm64
  # ============================================================
  build-api-arm64:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.api
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/stasis-api:latest-arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # API Manifest
  # ============================================================
  create-api-manifest:
    runs-on: ubuntu-latest
    needs: [build-api-amd64, build-api-arm64]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create API manifest
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository_owner }}/stasis-api:latest \
            --tag ghcr.io/${{ github.repository_owner }}/stasis-api:${{ github.sha }} \
            ghcr.io/${{ github.repository_owner }}/stasis-api:latest-amd64 \
            ghcr.io/${{ github.repository_owner }}/stasis-api:latest-arm64

  # ============================================================
  # Web Image - amd64
  # ============================================================
  build-web-amd64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Web amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.web
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/stasis-web:latest-amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # Web Image - arm64
  # ============================================================
  build-web-arm64:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Web arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.web
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/stasis-web:latest-arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # Web Manifest
  # ============================================================
  create-web-manifest:
    runs-on: ubuntu-latest
    needs: [build-web-amd64, build-web-arm64]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Web manifest
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository_owner }}/stasis-web:latest \
            --tag ghcr.io/${{ github.repository_owner }}/stasis-web:${{ github.sha }} \
            ghcr.io/${{ github.repository_owner }}/stasis-web:latest-amd64 \
            ghcr.io/${{ github.repository_owner }}/stasis-web:latest-arm64

  # ============================================================
  # AIO Image - amd64
  # ============================================================
  build-aio-amd64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push AIO amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.aio
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/stasis-all-in-one:latest-amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # AIO Image - arm64
  # ============================================================
  build-aio-arm64:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push AIO arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.aio
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/stasis-all-in-one:latest-arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # AIO Manifest
  # ============================================================
  create-aio-manifest:
    runs-on: ubuntu-latest
    needs: [build-aio-amd64, build-aio-arm64]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create AIO manifest
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository_owner }}/stasis-all-in-one:latest \
            --tag ghcr.io/${{ github.repository_owner }}/stasis-all-in-one:${{ github.sha }} \
            ghcr.io/${{ github.repository_owner }}/stasis-all-in-one:latest-amd64 \
            ghcr.io/${{ github.repository_owner }}/stasis-all-in-one:latest-arm64
