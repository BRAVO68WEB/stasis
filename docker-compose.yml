services:
  nginx:
    image: nginx:alpine
    container_name: stasis-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_certs:/etc/nginx/certs
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: stasis-api
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    environment:
      - CONFIG_PATH=/app/configs/config.yaml
      - STASIS_DATABASE_HOST=postgres
      - STASIS_DATABASE_PORT=5432
      - STASIS_DATABASE_USER=${STASIS_DATABASE_USER:-stasis}
      - STASIS_DB_PASSWORD=${STASIS_DB_PASSWORD:?Set STASIS_DB_PASSWORD}
      - STASIS_DATABASE_DBNAME=${STASIS_DATABASE_DBNAME:-stasis}
      - STASIS_DATABASE_SSLMODE=disable
      - STASIS_SERVER_HOST=0.0.0.0
      - STASIS_SERVER_PORT=8080
      - STASIS_SERVER_MODE=release
      - STASIS_SSH_HOST=0.0.0.0
      - STASIS_SSH_PORT=2222
      - STASIS_STORAGE_TYPE=filesystem
      - STASIS_STORAGE_BASE_PATH=/app/data/repos
      - STASIS_OIDC_ENABLED=${STASIS_OIDC_ENABLED:-false}
      - STASIS_OIDC_ISSUER_URL=${STASIS_OIDC_ISSUER_URL:-}
      - STASIS_OIDC_CLIENT_ID=${STASIS_OIDC_CLIENT_ID:-}
      - STASIS_OIDC_CLIENT_SECRET=${STASIS_OIDC_CLIENT_SECRET:-}
      - STASIS_OIDC_REDIRECT_URL=${STASIS_OIDC_REDIRECT_URL:-http://localhost:8080/api/v1/auth/oidc/callback}
      - STASIS_OIDC_JWT_SECRET=${STASIS_OIDC_JWT_SECRET:-change-this-secret-in-production}
      - STASIS_OIDC_FRONTEND_URL=${STASIS_OIDC_FRONTEND_URL:-http://localhost}
      - STASIS_CI_API_KEY=${STASIS_CI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "2222:2222"
    volumes:
      - repo_data:/app/data/repos
      - ./configs/config.yaml:/app/configs/config.yaml:ro
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./cmd
        - action: rebuild
          path: ./internal
        - action: rebuild
          path: ./pkg
        - action: rebuild
          path: ./go.mod
        - action: sync+restart
          path: ./configs
          target: /app/configs

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        - NEXT_PUBLIC_API_URL=http://localhost/api
        - STASIS_SERVER_HOSTED_URL=http://localhost
        - STASIS_SSH_HOST_NAME=localhost:2222
    container_name: stasis-web
    expose:
      - "3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost/api
      - STASIS_SERVER_HOSTED_URL=http://localhost
      - STASIS_SSH_HOST_NAME=localhost:2222
      - DOCKER_ENV=true
    depends_on:
      - api
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./web

  postgres:
    image: postgres:17-alpine
    container_name: stasis-postgres
    environment:
      POSTGRES_USER: ${STASIS_DATABASE_USER:-stasis}
      POSTGRES_PASSWORD: ${STASIS_DB_PASSWORD:?Set STASIS_DB_PASSWORD}
      POSTGRES_DB: ${STASIS_DATABASE_DBNAME:-stasis}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STASIS_DATABASE_USER:-stasis}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  repo_data:
  nginx_certs:

networks:
  stasis-network:
    driver: bridge
    name: stasis-network
